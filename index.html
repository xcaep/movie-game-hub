<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Game Hub</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
}
header{
    background:#111827;
    padding:20px;
    text-align:center;
}
h1{
    margin:0;
}
nav{
    margin-top:10px;
}
nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
}
.section{
    padding:40px 20px;
}
.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    margin:15px 0;
}
</style>
</head>

<body>

<header>
    <h1>Movie Game Hub</h1>
    <nav>
        <a href="#movies">Movies</a>
        <a href="#games">Games</a>
        <a href="#tools">Tools</a>
    </nav>
</header>

<section class="section" id="movies">
    <h2>Movies</h2>
    <div class="card">
        Browse movie information and discover new films.
    </div>
</section>

<section class="section" id="games">
    <h2>Games</h2>
    <div class="card">
        Play or explore games here.
    </div>
</section>

<section class="section" id="tools">
    <h2>Tools</h2>
    <div class="card">
        Web tools and utilities.
    </div>
</section>

</body>
</html>
